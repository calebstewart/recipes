# Builds the static site with build.py and pushes dist/ to the gh-pages branch.
#
# One-time manual step: in the repo Settings -> Pages, set the source to branch
# `gh-pages`, folder `/ (root)`. The branch does not exist until the first
# successful run on main creates it, so do this after that run finishes.
#
# Pull requests build only. A malformed recipe fails the build there, so it
# fails review rather than production.

---
name: Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out the repository
        uses: actions/checkout@v5
        with:
          # build.py reads `git log` to derive datePublished, so it needs the
          # full history rather than a shallow clone.
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          # There is no lockfile: the dependencies are the PEP 723 header in
          # build.py, so that is what the cache key has to follow.
          cache-dependency-glob: build.py

      - name: Build the site
        # build.py declares its dependencies in a PEP 723 header; uv resolves
        # them and picks the interpreter, so there is no requirements file and
        # no separate Python setup step.
        run: uv run build.py --out dist

      - name: Deploy to gh-pages
        if: >-
          github.ref == 'refs/heads/main'
          && github.event_name != 'pull_request'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          commit_message: 'Deploy site from ${{ github.sha }}'
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
