<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>$title</title>
<meta name="description" content="$meta_description">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#faf7f2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#17140f" media="(prefers-color-scheme: dark)">
<link rel="canonical" href="$canonical">
<link rel="icon" type="image/svg+xml" href="${base}assets/favicon.svg">
<link rel="stylesheet" href="${base}assets/style.css">
$head_extra
</head>
<body class="$body_class">
<a class="skip-link" href="#main">Skip to content</a>

<header class="site-header">
  <a class="site-title" href="${base}">$site_title</a>
  $nav
</header>

<main id="main">$content</main>

<footer class="site-footer">
  <p class="colophon">A personal collection, kept as plain Markdown.</p>
  <p class="colophon"><a href="https://github.com/calebstewart/recipes">Source on GitHub</a></p>
</footer>

$scripts
</body>
</html>
