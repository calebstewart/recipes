    buy: 1 head = 10 cloves # check: heads run about 8 to 12
  ginger:
    section: produce
    also: [fresh ginger]
  jalapeño: produce
  lemons:
    section: produce
    also: [lemon juice, fresh lemon juice]
    buy: 1 lemon = 2 Tbsp. # the tahini: 1/4 c. juice is about 2 medium lemons
  lettuce blend:
    section: produce
    buy: 1 (5 oz.) box = 5 oz. # the lunch bowl's box
  limes:
    section: produce
    also: [lime juice, fresh lime juice]
    buy: 1 lime = 2 Tbsp. # the limeade: 1 c. juice from about 8 limes
  lime wheels and mint sprigs: produce
  mint:
    section: produce
    also: [fresh mint, fresh mint leaves and tender stems]
    buy: 1 bunch = 1 c. # check: packed leaves
  onion:
    section: produce
    also: [large onion]
  parsley:
    section: produce
    also: [fresh parsley]
    buy: 1 bunch = 2 oz. # check
  persian cucumbers: produce
  pumpkin:
    section: produce
    also: [raw pumpkin]
    buy: 1 pie pumpkin = 3 c. # check: the least certain of these
  red onion:
    section: produce
    also: [large red onion]
    buy: 1 large onion = 8 oz. # the pickled onions: a large one is about 8 oz.
  roma tomatoes:
    section: produce
    buy: 1 tomato = 4 oz. # check
  shallot: produce
  strawberries:
    section: produce
    also: [fresh strawberries]
    buy: 1 (1 lb.) container = 16 # check: berries vary a lot

