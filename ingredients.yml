  dried thyme:
    section: pantry
    also: [dried thyme leaves]
  fine sea salt: pantry
  garlic powder: pantry
  granulated sugar: pantry
  ground cumin: pantry
  ground nutmeg:
    section: pantry
    also: [nutmeg]
  honey: pantry
  hot sauce: pantry
  kosher salt: pantry
  olive oil:
    section: pantry
    also: [extra-virgin olive oil]
  paprika: pantry
