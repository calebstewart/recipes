# Ingredients, for the shopping list on the plan page.
#
# Recipes write ingredients however reads best in the recipe: "3 garlic cloves,
# smashed", "1/2 c. extra-virgin olive oil, divided". The shopping list strips
# the amount, the unit, anything in parentheses and everything after the first
# comma, then looks what is left up here so the same thing from two recipes
# lands on one line.
#
# Each entry is the name the list shows, then either just its store section:
#
#   shallot: produce
#
# or a mapping with any of:
#
#   section: where it sits in the store (one of `sections:` below)
#   also:    other ways recipes write it, merged into this line
#   unit:    what a bare count means — `unit: clove` makes "3 garlic" 3 cloves
#
# Matching ignores case and a plural on the last word, so "garlic cloves" and
# "garlic clove" are one alias. The build warns about any ingredient that is not
# here; it still shows up, under Other, until it is added.

# Store sections, in the order the list shows them — the order you walk the
# store. `pantry` is special: things you probably have, shown last and collapsed
# so you check the cupboard instead of buying another jar. `none` is for things
# that never go on a list at all, like water.
sections:
  produce: Produce
  meat: Meat
  refrigerated: Dairy & refrigerated
  canned: Canned & jarred
  dry: Pasta, grains & baking
  spices: Spices & dried chiles
  pantry: Check the pantry

ingredients:
  # Produce
  basil:
    section: produce
    also: [fresh basil leaves]
